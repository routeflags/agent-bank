[defaults]
# ansible/ 直下で `ansible-playbook playbooks/app.yml` を実行する前提。
# リポジトリ直下から実行する場合は ANSIBLE_CONFIG=ansible/ansible.cfg を付ける。
inventory = inventory
stdout_callback = default
interpreter_python = auto_silent
# ホスト鍵は必ず検証する（--check でも同じ）。
host_key_checking = True
retry_files_enabled = False
# 秘密は Vault で渡す。パスワードファイルを置く場合は次を有効化する
# （.vault_pass は .gitignore 済み）。
vault_password_file = .vault_pass

[ssh_connection]
pipelining = True
