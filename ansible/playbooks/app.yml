# アプリの反映（Issue #121）
#
# やること（script/deploy_production.sh と同等の流れ）:
#   1. rsync でコード転送（同じ除外条件。.env は上書きしない）
#   2. .env のうち変数で管理するキーだけを lineinfile で更新
#   3. Caddyfile の `http://` 接頭辞を app_domain に応じて付け外し
#   4. 変更有りなら caddy を再起動 / web・worker を再作成
#   5. web イメージのビルドと `compose up -d`
#   6. /_health が 200 を返すまで待機
#   7. スモークチェック（script/smoke_check.rb）
#
# 実行（ansible/ 直下）:
#   ansible-playbook playbooks/app.yml --check --diff          # ドライラン
#   ansible-playbook playbooks/app.yml                         # 反映
#   ansible-playbook playbooks/app.yml -e app_domain=example.com -e force_ssl=true
#
# 秘密情報は group_vars/vault.yml（ansible-vault）または --ask-vault-pass で渡す。
# この playbook は .env を新規作成しない（既存の秘密を失わないため）。
---
- name: アプリの反映（コード転送 / .env / Caddyfile / compose up / スモーク）
  hosts: app
  become: true
  gather_facts: false

  vars:
    # ドメインが未設定なら現行どおり HTTP 運用（Caddyfile は http:// 固定）。
    caddy_https_enabled: "{{ app_domain | length > 0 }}"
    published_scheme: "{{ 'https' if caddy_https_enabled | bool else 'http' }}"
    # deploy_production.sh と同じ除外条件。.env は絶対に上書きしない。
    rsync_exclude_args: >-
      --exclude .git --exclude .delta --exclude .env
      --exclude node_modules --exclude client/node_modules
      --exclude vendor/bundle --exclude tmp --exclude log
      --exclude public/assets --exclude public/webpack --exclude public/packs
      --exclude .rspec_status
    # .env に入れる非秘密のキー。値はここ（変数）が正本。
    managed_env:
      APP_DOMAIN: "{{ app_domain if app_domain | length > 0 else 'localhost' }}"
      FORCE_SSL: "{{ '1' if force_ssl | bool else '' }}"
      domain: "{{ app_domain }}"
      always_use_ssl: "{{ 'true' if force_ssl | bool else '' }}"
      ADMIN_ALLOWED_IPS: "{{ admin_allowed_ips }}"
    # 既存の .env に必ず存在していてほしいキー（値は検査しない）。
    required_env_keys:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_USER
      - MYSQL_PASSWORD
      - DATABASE_URL

  tasks:
    - name: FORCE_SSL と APP_DOMAIN の整合を確認する
      ansible.builtin.assert:
        that:
          - not (force_ssl | bool) or (app_domain | length > 0)
        fail_msg: >-
          force_ssl=true は app_domain が必須です。
          Caddy が HTTP のまま Rails だけ https へリダイレクトすると全画面到達不能になります。
        quiet: true

    - name: コードを転送する（controller -> VPS / rsync）
      ansible.builtin.command:
        cmd: >-
          rsync -az --delete --out-format=CHANGED:%i:%n {{ rsync_exclude_args }}
          {{ playbook_dir }}/../../ {{ ansible_user }}@{{ ansible_host }}:{{ app_dir }}/
      delegate_to: localhost
      become: false
      register: rsync_result
      changed_when: "'CHANGED:' in (rsync_result.stdout | default(''))"

    - name: VPS の .env の有無を確認する
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: env_stat

    - name: .env が無ければ中止する（自動作成しない）
      ansible.builtin.assert:
        that:
          - env_stat.stat.exists
        fail_msg: >-
          {{ app_dir }}/.env がありません。秘密情報の正本が VPS にあるため自動作成しません。
          cp {{ app_dir }}/.env.example {{ app_dir }}/.env して必要な値を埋めてから再実行してください。
        quiet: true

    - name: .env を読み込む
      ansible.builtin.slurp:
        src: "{{ app_dir }}/.env"
      register: env_raw
      no_log: true

    - name: .env に必須キーが揃っているか確認する
      ansible.builtin.assert:
        that:
          - (env_raw.content | b64decode) is search('(?m)^' ~ item ~ '=')
        fail_msg: "{{ item }} が .env にありません（値は表示しません）"
        quiet: true
      loop: "{{ required_env_keys }}"

    - name: 変数で管理するキーを .env に反映する
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: false
      loop: "{{ managed_env | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      notify: web と worker を再作成する

    - name: Vault で渡された秘密を .env に反映する
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: false
      loop: "{{ (vault_env | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      notify: web と worker を再作成する

    # リポジトリの Caddyfile は HTTP 固定（既存方針）。転送で http:// に戻るため、
    # 毎回ここで 1 行だけ差分を当てて冪等にする。
    - name: Caddyfile を HTTPS 形にする（app_domain 設定時）
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/Caddyfile"
        regexp: '^http://(\{\$APP_DOMAIN:localhost\}) \{$'
        line: '\1 {'
        backrefs: true
      when: caddy_https_enabled | bool
      notify: caddy を再起動する

    - name: Caddyfile を HTTP 形に戻す（app_domain 未設定時）
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/Caddyfile"
        regexp: '^(\{\$APP_DOMAIN:localhost\}) \{$'
        line: 'http://\1 {'
        backrefs: true
      when: not (caddy_https_enabled | bool)
      notify: caddy を再起動する

    # コメント行にも同じ文字列が出るため、行頭がサイトアドレスである行だけを見る。
    - name: Caddyfile のサイトアドレス行を確認する
      ansible.builtin.command:
        cmd: grep -nE '^(http://)?\{\$APP_DOMAIN:localhost\} \{' {{ app_dir }}/Caddyfile
      register: caddy_line
      changed_when: false

    - name: サイトアドレス行
      ansible.builtin.debug:
        msg: "{{ caddy_line.stdout }}"

    # .env と Caddyfile の変更を、以下のヘルスチェックより先に適用する。
    - name: ハンドラをここで実行する
      ansible.builtin.meta: flush_handlers

    - name: web イメージをビルドする
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} build web
        chdir: "{{ app_dir }}"
      when: app_build | bool

    - name: スタックを起動する
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} up -d
        chdir: "{{ app_dir }}"

    - name: /_health が 200 を返すまで待つ
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/_health
        status_code: 200
        return_content: false
      register: health
      until: health.status | default(0) == 200
      retries: 60
      delay: 10

    - name: スモークのベース URL を決める
      ansible.builtin.set_fact:
        smoke_base: "{{ published_scheme }}://{{ app_domain if app_domain | length > 0 else 'localhost' }}"

    - name: スモークチェック（コンテナ内から）
      ansible.builtin.command:
        cmd: >-
          docker run --rm --network host
          -v {{ app_dir }}/script/smoke_check.rb:/tmp/smoke_check.rb:ro
          {{ web_image_name }} ruby /tmp/smoke_check.rb {{ smoke_base }}
      register: smoke
      changed_when: false
      when: smoke_enabled | bool

    - name: 結果の要約
      ansible.builtin.debug:
        msg:
          - "サイトアドレス: {{ caddy_line.stdout | trim }}"
          - "FORCE_SSL: {{ '1' if force_ssl | bool else '（未設定）' }}"
          - "スモーク: {{ (smoke.stdout_lines | default(['スキップ'])) | last }}"

  handlers:
    - name: caddy を再起動する
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} restart caddy
        chdir: "{{ app_dir }}"

    - name: web と worker を再作成する
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} up -d --no-deps --force-recreate web worker
        chdir: "{{ app_dir }}"
